<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen Retouching — Before & After Gallery</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;font-family:Arial,sans-serif}.gallery{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#fff}.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .32s ease;pointer-events:none;display:flex;align-items:center;justify-content:center}.slide.active{opacity:1;visibility:visible;pointer-events:auto}.comparison{position:relative;width:100%;height:100%;overflow:hidden;user-select:none;touch-action:pan-y;cursor:ew-resize;background:#fff}.comparison img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.before-clip{position:absolute;inset:0;clip-path:inset(0 50% 0 0);pointer-events:none}.handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 0 2px #3338)}.handle:after{content:'‹  ›';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#fff;color:#111;font:bold 19px/1 Arial,sans-serif;box-shadow:0 2px 10px #0005;white-space:pre}.label{position:absolute;top:12px;padding:7px 12px;border-radius:20px;background:#151515b8;color:white;font:600 13px/1 Arial,sans-serif;pointer-events:none}.label.before{left:12px}.label.after{right:12px}.dots{position:absolute;right:16px;bottom:16px;z-index:10;display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0006;border-radius:20px}.dot{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#ffffff80;cursor:pointer}.dot.active{background:#fff;box-shadow:0 0 0 2px #ffffff50}.play-toggle{width:13px;height:14px;display:grid;place-items:center;border:0;background:none;color:w draggable="false"></div><div class="handle"></div><span class="label before">Before</span><span class="label after">After</span></div></section><nav class="dots" aria-label="Gallery controls"><button class="play-toggle" type="button" aria-label="Pause automatic slideshow" aria-pressed="true"></button><button class="dot active" type="button" aria-label="Kitchen A" data-slide="0"></button><button class="dot" type="button" aria-label="Kitchen B" data-slide="1"></button><button class="dot" type="button" aria-label="Kitchen C" data-slide="2"></button></nav></main><script>(()=>{const gallery=document.querySelector('.gallery'),slides=[...gallery.querySelectorAll('.slide')],dots=[...gallery.querySelectorAll('.dot')],toggle=gallery.querySelector('.play-toggle'),comparisons=[...gallery.querySelectorAll('.comparison')];const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;let current=0,playing=!reduced,timeout=null,frame=null,dragging=null;const positions=[50,50,50];const waitBeforeDemo=10000,sweepDuration=6200,sweepCount=3,sweepGap=650,slideInterval=6000;function setPercent(i,p){positions[i]=Math.max(0,Math.min(100,p));comparisons[i].querySelector('.before-clip').style.clipPath=`inset(0 ${100-positions[i]}% 0 0)`;comparisons[i].querySelector('.handle').style.left=positions[i]+'%'}function setX(i,x){const r=comparisons[i].getBoundingClientRect();const image=comparisons[i].querySelector('img');const naturalRatio=image.naturalWidth&&image.naturalHeight?image.naturalWidth/image.naturalHeight:1920/1386;const boxRatio=r.width/r.height;let left=r.left,width=r.width;if(naturalRatio<boxRatio){width=r.height*naturalRatio;left=r.left+(r.width-width)/2}setPercent(i,(x-left)/width*100)}function cancel(){clearTimeout(timeout);timeout=null;if(frame!==null)cancelAnimationFrame(frame);frame=null}function show(i){current=(i+slides.length)%slides.length;slides.forEach((s,j)=>{s.classList.toggle('active',j===current);s.setAttribute('aria-hidden',j===current?'false':'true')});dots.forEach((d,j)=>{d.classList.toggle('active',j===current);if(j===current)d.setAttribute('aria-current','true');else d.removeAttribute('aria-current')})}function updateToggle(){toggle.setAttribute('aria-label',playing?'Pause automatic slideshow':'Play automatic slideshow');toggle.setAttribute('aria-pressed',String(playing));toggle.title=playing?'Pause slideshow':'Play slideshow';toggle.innerHTML=playing?'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>':'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1L11 6 2 11z"/></svg>'}function schedule(ms){if(!playing||document.hidden)return;timeout=setTimeout(()=>{show(current+1);begin(current===0?waitBeforeDemo:700)},ms)}function sweep(repetition=0){if(!playing||document.hidden)return;const i=current,initial=positions[i],keys=[initial,10,90,50],fractions=[0,.35,.77,1],start=performance.now();function tick(now){if(!playing||document.hidden||current!==i)return;const t=Math.min(1,(now-start)/sweepDuration);let seg=0;while(seg<2&&t>fractions[seg+1])seg++;const u=(t-fractions[seg])/(fractions[seg+1]-fractions[seg]),smooth=u*u*(3-2*u);setPercent(i,keys[seg]+(keys[seg+1]-keys[seg])*smooth);if(t<1)frame=requestAnimationFrame(tick);else{frame=null;if(repetition+1<sweepCount)timeout=setTimeout(()=>sweep(repetition+1),sweepGap);else schedule(1300)}}frame=requestAnimationFrame(tick)}function begin(wait){cancel();if(!playing||document.hidden)return;timeout=setTimeout(()=>sweep(0),wait)}function pause(){playing=false;cancel();updateToggle()}function resume(){playing=true;updateToggle();begin(waitBeforeDemo)}dots.forEach((d,i)=>d.addEventListener('click',()=>{pause();show(i)}));toggle.addEventListener('click',()=>playing?pause():resume());comparisons.forEach((el,i)=>{el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){return}pause();dragging=i;el.setPointerCapture(e.pointerId);setX(i,e.clientX)});el.addEventListener('pointermove',e=>{if(dragging===i)setX(i,e.clientX)});el.addEventListener('pointerup',()=>dragging=null);el.addEventListener('pointercancel',()=>dragging=null);let touchStart=null;el.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY,mode:null}},{passive:true});el.addEventListener('touchmove',e=>{if(!touchStart||e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(touchStart.mode===null){if(Math.hypot(dx,dy)<9)return;touchStart.mode=Math.abs(dx)>Math.abs(dy)*1.3?'horizontal':'vertical';if(touchStart.mode==='horizontal')pause()}if(touchStart.mode==='horizontal'){setX(i,t.clientX)}},{passive:true});el.addEventListener('touchend',()=>touchStart=null,{passive:true});el.addEventListener('touchcancel',()=>touchStart=null,{passive:true})});gallery.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){pause();show(current+(e.key==='ArrowRight'?1:-1))}});document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel();else if(playing)begin(waitBeforeDemo)});comparisons.forEach((_,i)=>setPercent(i,50));updateToggle();show(0);if(playing)begin(waitBeforeDemo)})();</script></body></html>
